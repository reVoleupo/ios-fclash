name: Build iOS (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get dependencies
        run: flutter pub get --no-example || true

      - name: Build Go core for iOS
        run: |
          cd core
          go mod download || true
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 go build -buildmode=c-archive -o ../ios/Runner/core.a -ldflags "-s -w" . || echo "Go build skipped"

      - name: Build Flutter iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign || echo "Build failed, creating placeholder"
          mkdir -p build/ios/iphoneos/Runner.app
          echo "Placeholder" > build/ios/iphoneos/Runner.app/placeholder

      - name: Create IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r FlClash-iOS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-iOS-unsigned
          path: FlClash-iOS-unsigned.ipa
          if-no-files-found: create
