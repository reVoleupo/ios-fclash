name: Build iOS (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Clone FlClash source
        run: |
          git clone --depth 1 --recursive https://github.com/chen08209/FlClash.git source
          cd source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get Flutter dependencies
        run: |
          cd source
          flutter pub get

      - name: Build Go core for iOS
        run: |
          cd source/core
          go mod download
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 go build -buildmode=c-shared -o ../ios/Runner/core.dylib -ldflags "-s -w" . || \
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 go build -buildmode=c-archive -o ../ios/Runner/core.a -ldflags "-s -w" .

      - name: Build Flutter iOS (unsigned)
        run: |
          cd source
          flutter build ios --release --no-codesign

      - name: Create IPA (unsigned)
        run: |
          cd source
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ../FlClash-iOS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-iOS-unsigned
          path: FlClash-iOS-unsigned.ipa
          if-no-files-found: warn
