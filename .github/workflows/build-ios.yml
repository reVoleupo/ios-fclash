name: Build iOS (Unsigned)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Clone FlClash source
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --depth 1 --recursive https://github.com/chen08209/FlClash.git /tmp/flclash

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Add iOS platform (min iOS 14.0)
        working-directory: /tmp/flclash
        run: flutter create --platforms ios --ios-org-name com.flclash --project-name fl_clash .

      - name: Set minimum iOS version to 14.0
        working-directory: /tmp/flclash
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/MinimumOSVersion = 13.0/MinimumOSVersion = 14.0/g' ios/Runner/Info.plist 2>/dev/null || true

      - name: Install dependencies
        working-directory: /tmp/flclash
        run: flutter pub get

      - name: Build iOS (unsigned)
        working-directory: /tmp/flclash
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p /tmp/Payload
          cp -r /tmp/flclash/build/ios/iphoneos/Runner.app /tmp/Payload/
          cd /tmp && zip -r ${{ github.workspace }}/FlClash-iOS-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-iOS-unsigned
          path: FlClash-iOS-unsigned.ipa
