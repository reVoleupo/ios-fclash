name: Build iOS (Unsigned)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone FlClash source
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --depth 1 --recursive https://github.com/chen08209/FlClash.git /tmp/flclash

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'

      - name: Build iOS
        working-directory: /tmp/flclash
        run: |
          flutter pub get
          dart setup.dart ios

      - name: Create IPA
        working-directory: /tmp/flclash
        run: |
          mkdir -p Payload
          if ls dist/*.app 2>/dev/null; then
            cp -r dist/*.app Payload/
          else
            cp -r build/ios/iphoneos/Runner.app Payload/
          fi
          zip -r ${{ github.workspace }}/FlClash-iOS-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-iOS-unsigned
          path: FlClash-iOS-unsigned.ipa
